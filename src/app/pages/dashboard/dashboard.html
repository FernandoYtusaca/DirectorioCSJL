<div class="app-layout">
  <app-sidebar></app-sidebar>

  <div class="main-content">
    <app-header></app-header>

    <main class="content-body">
      <div class="breadcrumb">Inicio > Dependencias</div>

      <div class="section-header">
        <h3 class="page-title">Directorio de Dependencias</h3>
        <button class="btn-add-new" (click)="abrirModalCrear()">+ Registrar Nueva Dependencia</button>
      </div>

      <app-filtros-dependencias (aplicar)="onAplicarFiltros($event)"></app-filtros-dependencias>

      <app-tabla-dependencias
        [dependencias]="dependenciasFiltradas"
        (ver)="onVer($event)"
        (editar)="onEditar($event)"
        (eliminar)="onEliminar($event)">
      </app-tabla-dependencias>

      <app-metricas-dependencias [metricas]="metricas"></app-metricas-dependencias>
    </main>
  </div>
</div>
