<div class="table-container">
  <table class="custom-table">
    <thead>
      <tr>
        <th>DEPENDENCIA</th>
        <th>SEDE</th>
        <th>TIPO</th>
        <th>ESPECIALIDAD</th>
        <th>ANEXOS</th>
        <th>ACCIONES</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let dep of dependencias">
        <td>
          <div class="dep-title">{{ dep.nombre }}</div>
          <div class="dep-subtitle">{{ dep.nivel }}</div>
        </td>
        <td>{{ dep.sede }}</td>
        <td>
          <span class="badge" [ngClass]="dep.tipo === 'Jurisdiccional' ? 'badge-jurisdiccional' : 'badge-administrativa'">
            {{ dep.tipo }}
          </span>
        </td>
        <td>{{ dep.especialidad }}</td>
        <td class="anexos-cell">📞 <strong>{{ dep.anexos }}</strong></td>
        <td class="actions-cell">
          <button class="action-btn-img view-icon" (click)="ver.emit(dep)" title="Visualizar">
            <svg viewBox="0 0 24 24" width="18" height="18" stroke="#1e293b" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>

          <button class="action-btn-img edit-icon" (click)="editar.emit(dep)" title="Editar">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="#0b46be" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </button>

          <button class="action-btn-img delete-icon" (click)="eliminar.emit(dep.id)" title="Eliminar">
            <svg viewBox="0 0 24 24" width="16" height="16" stroke="#dc2626" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>
          </button>
        </td>
      </tr>
      <tr *ngIf="dependencias.length === 0">
        <td colspan="6" style="text-align: center; color: #64748b; padding: 24px;">
          No se encontraron registros con los filtros seleccionados.
        </td>
      </tr>
    </tbody>
  </table>

  <div class="table-pagination">
    <span>Mostrando 1-{{ dependencias.length }} de {{ dependencias.length }} registros</span>
  </div>
</div>
