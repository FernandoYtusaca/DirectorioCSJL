      <span class="number">{{ metricas.totalJuzgados }}</span>
      <span class="label">Juzgados Activos</span>
    </div>
  </div>
  <div class="metric-card">

    <div class="metric-data">
      <span class="number">{{ metricas.totalUnidades }}</span>
