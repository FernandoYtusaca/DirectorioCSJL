<div class="dialog-fondo">

    <div
        class="dialog"
        role="dialog"
        aria-modal="true"
    >

        <div class="dialog-header">

            <h2>
                {{ titulo }}
            </h2>

        </div>


        <div class="dialog-body">

            <p>
                {{ mensaje }}
            </p>

        </div>


        <div class="dialog-footer">

            <button
                type="button"
                class="btn-cancelar"
                (click)="cancelar()"
            >

                {{ textoCancelar }}

            </button>


            <button
                type="button"
                class="btn-confirmar"
                (click)="confirmar()"
            >

                {{ textoConfirmar }}

            </button>

        </div>

    </div>

</div>
